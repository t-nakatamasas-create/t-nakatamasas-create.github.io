<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム同時通訳字幕アプリ (全画面版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #070a12;
            color: #f8fafc;
        }

        /* ネオンイエロー発光字幕エフェクト */
        .text-glow-yellow {
            color: #fef08a; /* Yellow-200 */
            text-shadow: 
                0 0 16px rgba(250, 204, 21, 0.95),
                0 0 32px rgba(245, 158, 11, 0.7),
                0 0 60px rgba(217, 119, 6, 0.4);
        }

        /* 輪郭強調ブラックシャドウ */
        .text-outline-dark {
            text-shadow: 
                -2px -2px 0 #000, 
                 2px -2px 0 #000, 
                -2px  2px 0 #000, 
                 2px  2px 0 #000, 
                 0 6px 20px rgba(0, 0, 0, 0.98),
                 0 0 25px rgba(250, 204, 21, 0.7);
        }

        /* ガラスモーフィズム背景 */
        .glass-box {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(250, 204, 21, 0.2);
        }

        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(7, 10, 18, 0.8);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(245, 158, 11, 0.4);
            border-radius: 9999px;
        }
    </style>
</head>

<body class="h-screen w-screen overflow-hidden flex flex-col justify-between selection:bg-amber-500 selection:text-black">

    <!-- 全画面トップコントロールバー (薄型オーバーレイ) -->
    <header class="w-full bg-slate-900/90 border-b border-amber-500/20 backdrop-blur-md px-4 py-3 z-30 flex-shrink-0">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
            
            <!-- ロゴ & タイトル -->
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 via-yellow-400 to-orange-500 flex items-center justify-center text-slate-950 shadow-md shadow-amber-500/20 font-black">
                    <i class="fa-solid fa-language text-lg"></i>
                </div>
                <div>
                    <h1 class="text-sm font-bold text-white flex items-center gap-2">
                        リアルタイム同時通訳字幕
                        <span class="px-2 py-0.5 text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-full font-medium">全画面表示</span>
                    </h1>
                </div>
            </div>

            <!-- 言語設定 & 自動音声ボタン -->
            <div class="flex flex-wrap items-center gap-2 text-xs">
                <!-- 話者言語 (入力) -->
                <select id="source-lang" class="bg-slate-800 text-slate-200 border border-slate-700 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-amber-500">
                    <option value="ja-JP" selected>日本語 (Japanese)</option>
                    <option value="en-US">英語 (English)</option>
                    <option value="zh-TW">台湾語：繁体字</option>
                    <option value="th-TH">タイ語 (Thai)</option>
                    <option value="ko-KR">韓国語 (Korean)</option>
                    <option value="es-ES">スペイン語 (Spanish)</option>
                    <option value="fr-FR">フランス語 (French)</option>
                </select>

                <i class="fa-solid fa-arrow-right text-slate-500 text-xs"></i>

                <!-- 通訳言語 (出力) -->
                <select id="target-lang" class="bg-slate-800 text-slate-200 border border-slate-700 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-amber-500">
                    <option value="en" selected>英語 (English)</option>
                    <option value="ja">日本語 (Japanese)</option>
                    <option value="zh-TW">台湾語：繁体字</option>
                    <option value="th">タイ語 (Thai)</option>
                    <option value="ko">韓国語 (Korean)</option>
                    <option value="es">スペイン語 (Spanish)</option>
                    <option value="fr">フランス語 (French)</option>
                </select>

                <!-- 自動読み上げ切り替え -->
                <button id="btn-toggle-tts" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 flex items-center gap-1.5 transition-colors">
                    <i id="tts-icon" class="fa-solid fa-volume-xmark text-slate-400"></i>
                    <span id="tts-label">自動読み上げ OFF</span>
                </button>
            </div>

            <!-- ブラウザ全画面表示ボタン / 履歴表示切替 -->
            <div class="flex items-center gap-2">
                <button id="btn-toggle-history" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-lg text-xs transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-clock-rotate-left text-amber-400"></i>
                    <span>履歴</span>
                </button>
                <button id="btn-native-fullscreen" title="ディスプレイ全画面表示" class="p-2 text-slate-300 hover:text-amber-300 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg transition-all">
                    <i id="native-fs-icon" class="fa-solid fa-expand"></i>
                </button>
            </div>

        </div>
    </header>

    <!-- 全画面メイン字幕表示エリア -->
    <main class="flex-1 w-full flex flex-col justify-between p-6 md:p-10 relative overflow-hidden">
        
        <!-- 字幕トップ情報（ステータス ＆ 文字サイズ操作） -->
        <div class="flex items-center justify-between z-10">
            <div class="flex items-center gap-2.5 bg-slate-900/80 px-3.5 py-1.5 rounded-full border border-slate-800 backdrop-blur-sm">
                <span id="live-indicator" class="w-3 h-3 rounded-full bg-slate-500"></span>
                <span id="live-status-text" class="text-xs font-bold text-slate-400 uppercase tracking-wider">マイク待機中</span>
            </div>

            <div class="flex items-center gap-2 bg-slate-900/80 px-3 py-1.5 rounded-xl border border-slate-800 backdrop-blur-sm">
                <button id="btn-font-smaller" title="文字を小さく" class="p-1 px-2 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg text-xs border border-slate-700">
                    <i class="fa-solid fa-minus"></i>
                </button>
                <span id="font-size-label" class="text-xs text-amber-400 font-mono font-bold px-1">48px</span>
                <button id="btn-font-larger" title="文字を大きく" class="p-1 px-2 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg text-xs border border-slate-700">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button id="btn-speak-current" title="現在の字幕を音声再生" class="ml-1 p-1 px-2.5 text-amber-300 hover:text-amber-200 bg-amber-950/80 hover:bg-amber-900 rounded-lg text-xs border border-amber-600/50">
                    <i class="fa-solid fa-volume-high"></i> 再生
                </button>
            </div>
        </div>

        <!-- 巨大字幕テキストエリア (画面中央にドカンと表示) -->
        <div class="my-auto py-8 text-center space-y-6 z-10 max-w-6xl mx-auto w-full">
            <!-- 翻訳結果 (黄色発光ネオンテキスト) -->
            <p id="target-subtitle-text" class="text-glow-yellow text-outline-dark font-black tracking-wide leading-snug transition-all duration-150" style="font-size: 48px;">
                音声入力を待機中...
            </p>

            <!-- 認識した原文テキスト -->
            <p id="source-subtitle-text" class="text-lg md:text-2xl font-medium text-slate-300/80 max-w-4xl mx-auto pt-4 border-t border-slate-800/60">
                「通訳を開始する」を押すと、リアルタイム音声認識とイエロー発光字幕が始まります。
            </p>
        </div>

        <!-- 下部通訳コントロールエリア (常に画面下に固定) -->
        <div class="flex items-center justify-between gap-4 z-10 pt-4 border-t border-slate-800/80 max-w-7xl mx-auto w-full">
            
            <div class="flex items-center gap-3">
                <!-- 通訳開始/停止ボタン -->
                <button id="btn-toggle-mic" class="px-8 py-4 bg-gradient-to-r from-amber-500 via-yellow-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 rounded-2xl font-black text-base shadow-2xl shadow-amber-500/30 flex items-center gap-3 transition-all active:scale-95">
                    <i id="mic-btn-icon" class="fa-solid fa-microphone text-lg"></i>
                    <span id="mic-btn-text">通訳を開始する</span>
                </button>
            </div>

            <!-- 音声入力中表示 ＆ 時刻 -->
            <div class="flex items-center gap-4 text-xs text-slate-400">
                <span id="speech-interim-tag" class="opacity-0 transition-opacity duration-200 text-amber-400 font-semibold flex items-center gap-2 bg-amber-500/10 border border-amber-500/20 px-3 py-1.5 rounded-full">
                    <i class="fa-solid fa-spinner animate-spin text-xs"></i> 聞き取り中...
                </span>
                <span id="last-updated-time" class="font-mono text-slate-500 hidden sm:inline">--:--:--</span>
            </div>

        </div>

        <!-- ドロワー式 履歴パネル (画面右側からスライドイン) -->
        <aside id="history-drawer" class="fixed top-0 right-0 h-full w-full sm:w-96 glass-box z-40 transform translate-x-full transition-transform duration-300 ease-in-out p-5 flex flex-col justify-between shadow-2xl">
            <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-amber-400"></i> 通訳履歴ログ
                </h2>
                <button id="btn-close-history" class="p-1.5 text-slate-400 hover:text-white rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div id="history-container" class="flex-1 my-4 space-y-3 overflow-y-auto pr-1">
                <p id="history-placeholder" class="text-center text-slate-500 py-12 text-xs">
                    会話が認識されるとここに字幕履歴が追加されます。
                </p>
            </div>

            <div class="pt-3 border-t border-slate-800 flex items-center justify-between gap-2">
                <button id="btn-clear-all" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 text-xs font-medium transition-colors flex items-center gap-1.5">
                    <i class="fa-solid fa-trash-can text-slate-400"></i> クリア
                </button>
                <div class="flex gap-2">
                    <button id="btn-export-csv" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 text-xs font-medium transition-colors flex items-center gap-1.5">
                        <i class="fa-solid fa-file-csv text-emerald-400"></i> CSV
                    </button>
                    <button id="btn-export-txt" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700 text-xs font-medium transition-colors flex items-center gap-1.5">
                        <i class="fa-solid fa-file-lines text-amber-400"></i> TXT
                    </button>
                </div>
            </div>
        </aside>

    </main>

    <!-- トースト通知 -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none"></div>

    <script>
        'use strict';

        // アプリ状態保持
        const appState = {
            isListening: false,
            autoTTS: false,
            currentFontSize: 48,
            sourceLang: 'ja-JP',
            targetLang: 'en',
            voices: [],
            history: [],
            recognition: null
        };

        // DOMエレメント参照
        const el = {
            sourceLang: document.getElementById('source-lang'),
            targetLang: document.getElementById('target-lang'),
            btnToggleTts: document.getElementById('btn-toggle-tts'),
            ttsIcon: document.getElementById('tts-icon'),
            ttsLabel: document.getElementById('tts-label'),
            btnNativeFullscreen: document.getElementById('btn-native-fullscreen'),
            nativeFsIcon: document.getElementById('native-fs-icon'),
            
            liveIndicator: document.getElementById('live-indicator'),
            liveStatusText: document.getElementById('live-status-text'),
            targetSubtitleText: document.getElementById('target-subtitle-text'),
            sourceSubtitleText: document.getElementById('source-subtitle-text'),
            speechInterimTag: document.getElementById('speech-interim-tag'),
            lastUpdatedTime: document.getElementById('last-updated-time'),
            fontSizeLabel: document.getElementById('font-size-label'),
            btnFontSmaller: document.getElementById('btn-font-smaller'),
            btnFontLarger: document.getElementById('btn-font-larger'),
            btnSpeakCurrent: document.getElementById('btn-speak-current'),

            btnToggleMic: document.getElementById('btn-toggle-mic'),
            micBtnIcon: document.getElementById('mic-btn-icon'),
            micBtnText: document.getElementById('mic-btn-text'),
            
            btnToggleHistory: document.getElementById('btn-toggle-history'),
            btnCloseHistory: document.getElementById('btn-close-history'),
            historyDrawer: document.getElementById('history-drawer'),
            btnClearAll: document.getElementById('btn-clear-all'),
            btnExportCsv: document.getElementById('btn-export-csv'),
            btnExportTxt: document.getElementById('btn-export-txt'),

            historyContainer: document.getElementById('history-container'),
            historyPlaceholder: document.getElementById('history-placeholder'),

            toastContainer: document.getElementById('toast-container')
        };

        // 言語コード対応表
        const langMap = {
            'ja': 'ja-JP',
            'en': 'en-US',
            'zh-TW': 'zh-TW',
            'th': 'th-TH',
            'ko': 'ko-KR',
            'es': 'es-ES',
            'fr': 'fr-FR'
        };

        // 自然な音声合成の初期化
        function initVoices() {
            if (!('speechSynthesis' in window)) return;
            const updateVoices = () => {
                appState.voices = window.speechSynthesis.getVoices();
            };
            updateVoices();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = updateVoices;
            }
        }

        // 自然な音声での読み上げ (Natural TTS)
        function speakText(text, langCode) {
            if (!text || !('speechSynthesis' in window)) return;

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            const fullLang = langMap[langCode] || langCode;
            utterance.lang = fullLang;
            utterance.rate = 0.95;
            utterance.pitch = 1.0;

            const targetPrefix = fullLang.toLowerCase().replace('_', '-');
            const targetShort = targetPrefix.split('-')[0];

            const matchingVoices = appState.voices.filter(v => {
                const vLang = v.lang.toLowerCase().replace('_', '-');
                return vLang.startsWith(targetPrefix) || vLang.startsWith(targetShort);
            });

            const naturalVoice = matchingVoices.find(v => 
                v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Online') || v.name.includes('Premium') || v.name.includes('Neural')
            ) || matchingVoices[0];

            if (naturalVoice) {
                utterance.voice = naturalVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        // Web Speech API 音声認識
        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                showToast('お使いのブラウザは音声認識未対応です。Google Chrome または Microsoft Edge を推奨します。', 'error');
                el.btnToggleMic.disabled = true;
                el.btnToggleMic.classList.add('opacity-50', 'cursor-not-allowed');
                return;
            }

            appState.recognition = new SpeechRecognition();
            appState.recognition.continuous = true;
            appState.recognition.interimResults = true;
            appState.recognition.lang = appState.sourceLang;

            appState.recognition.onstart = () => {
                appState.isListening = true;
                updateMicUI(true);
            };

            appState.recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript += transcript;
                    }
                }

                if (interimTranscript) {
                    el.speechInterimTag.classList.remove('opacity-0');
                    el.sourceSubtitleText.textContent = interimTranscript;
                }

                if (finalTranscript) {
                    el.speechInterimTag.classList.add('opacity-0');
                    el.sourceSubtitleText.textContent = finalTranscript;
                    processTranslation(finalTranscript);
                }
            };

            appState.recognition.onerror = (event) => {
                console.warn('Speech error:', event.error);
                if (event.error === 'not-allowed') {
                    showToast('マイクの使用許可が必要です。ブラウザの設定をご確認ください。', 'error');
                    stopMic();
                }
            };

            appState.recognition.onend = () => {
                if (appState.isListening) {
                    try {
                        appState.recognition.start();
                    } catch (e) {
                        console.warn('Auto restart:', e);
                    }
                } else {
                    updateMicUI(false);
                }
            };
        }

        // API リアルタイム翻訳
        async function translateText(text, srcLang, tgtLang) {
            if (!text || !text.trim()) return '';

            let srcShort = srcLang;
            let tgtShort = tgtLang;

            if (srcShort === tgtShort) return text;

            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${srcShort}|${tgtShort}`;
                const response = await fetch(url);
                const data = await response.json();
                if (data && data.responseData && data.responseData.translatedText) {
                    return data.responseData.translatedText;
                }
            } catch (err) {
                console.error('Translation error:', err);
            }
            return `[通訳エラー] ${text}`;
        }

        async function processTranslation(originalText) {
            const timestamp = new Date().toLocaleTimeString('ja-JP');
            el.lastUpdatedTime.textContent = timestamp;

            el.targetSubtitleText.textContent = '翻訳中...';

            const translated = await translateText(originalText, appState.sourceLang, appState.targetLang);
            el.targetSubtitleText.textContent = translated;

            if (appState.autoTTS && translated) {
                speakText(translated, appState.targetLang);
            }

            addHistoryRecord({
                id: Date.now(),
                timestamp: timestamp,
                source: originalText,
                target: translated
            });
        }

        function startMic() {
            if (!appState.recognition) setupSpeechRecognition();
            if (appState.recognition && !appState.isListening) {
                try {
                    appState.recognition.lang = appState.sourceLang;
                    appState.recognition.start();
                } catch (err) {
                    console.error(err);
                }
            }
        }

        function stopMic() {
            appState.isListening = false;
            if (appState.recognition) {
                appState.recognition.stop();
            }
            updateMicUI(false);
        }

        function updateMicUI(isListening) {
            if (isListening) {
                el.liveIndicator.className = 'w-3 h-3 rounded-full bg-red-500 animate-pulse';
                el.liveStatusText.textContent = 'リアルタイム音声認識中';
                el.liveStatusText.className = 'text-xs font-semibold text-red-400 uppercase tracking-wider';

                el.btnToggleMic.className = 'px-8 py-4 bg-gradient-to-r from-red-600 to-pink-600 hover:from-red-500 hover:to-pink-500 text-white rounded-2xl font-black text-base shadow-2xl shadow-red-500/30 flex items-center gap-3 transition-all active:scale-95';
                el.micBtnIcon.className = 'fa-solid fa-microphone-slash text-lg';
                el.micBtnText.textContent = '通訳を停止する';
            } else {
                el.liveIndicator.className = 'w-3 h-3 rounded-full bg-slate-500';
                el.liveStatusText.textContent = 'マイク待機中';
                el.liveStatusText.className = 'text-xs font-semibold text-slate-400 uppercase tracking-wider';

                el.btnToggleMic.className = 'px-8 py-4 bg-gradient-to-r from-amber-500 via-yellow-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 rounded-2xl font-black text-base shadow-2xl shadow-amber-500/30 flex items-center gap-3 transition-all active:scale-95';
                el.micBtnIcon.className = 'fa-solid fa-microphone text-lg';
                el.micBtnText.textContent = '通訳を開始する';
            }
        }

        function addHistoryRecord(item) {
            appState.history.unshift(item);
            renderHistoryUI();
        }

        function renderHistoryUI() {
            if (appState.history.length === 0) {
                el.historyContainer.innerHTML = '';
                el.historyContainer.appendChild(el.historyPlaceholder);
                return;
            }

            el.historyContainer.innerHTML = '';

            appState.history.forEach(item => {
                const card = document.createElement('div');
                card.className = 'p-3 bg-slate-800/80 border border-slate-700/60 rounded-xl space-y-1 relative group hover:border-amber-500/50 transition-all';

                card.innerHTML = `
                    <div class="flex items-center justify-between text-[11px] text-slate-400">
                        <span class="font-mono text-amber-400"><i class="fa-regular fa-clock mr-1"></i>${escapeHTML(item.timestamp)}</span>
                        <button class="btn-play-history text-slate-400 hover:text-amber-300 p-1 rounded" title="再読み上げ">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                    </div>
                    <p class="text-sm font-bold text-yellow-300 leading-relaxed">${escapeHTML(item.target)}</p>
                    <p class="text-xs text-slate-400">${escapeHTML(item.source)}</p>
                `;

                card.querySelector('.btn-play-history').addEventListener('click', () => {
                    speakText(item.target, appState.targetLang);
                });

                el.historyContainer.appendChild(card);
            });
        }

        function escapeHTML(str) {
            return (str || '').replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function showToast(msg, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold flex items-center gap-2 border transition-all transform translate-y-2 opacity-0 ${
                type === 'error' ? 'bg-red-950/90 text-red-200 border-red-800' : 'bg-slate-900/90 text-amber-300 border-amber-500/40'
            }`;
            toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info'}"></i> ${escapeHTML(msg)}`;
            el.toastContainer.appendChild(toast);

            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function attachEventListeners() {
            // 通訳トグル
            el.btnToggleMic.addEventListener('click', () => {
                if (appState.isListening) {
                    stopMic();
                } else {
                    startMic();
                }
            });

            // 言語選択
            el.sourceLang.addEventListener('change', (e) => {
                appState.sourceLang = e.target.value;
                if (appState.recognition) appState.recognition.lang = appState.sourceLang;
            });
            el.targetLang.addEventListener('change', (e) => {
                appState.targetLang = e.target.value;
            });

            // TTSトグル
            el.btnToggleTts.addEventListener('click', () => {
                appState.autoTTS = !appState.autoTTS;
                if (appState.autoTTS) {
                    el.btnToggleTts.className = 'px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold flex items-center gap-1.5 transition-colors';
                    el.ttsIcon.className = 'fa-solid fa-volume-high text-slate-950';
                    el.ttsLabel.textContent = '自動読み上げ ON';
                    showToast('高音質自動音声読み上げを有効化しました');
                } else {
                    el.btnToggleTts.className = 'px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 flex items-center gap-1.5 transition-colors';
                    el.ttsIcon.className = 'fa-solid fa-volume-xmark text-slate-400';
                    el.ttsLabel.textContent = '自動読み上げ OFF';
                }
            });

            // 手動読み上げ
            el.btnSpeakCurrent.addEventListener('click', () => {
                speakText(el.targetSubtitleText.textContent, appState.targetLang);
            });

            // 文字サイズ変更
            el.btnFontSmaller.addEventListener('click', () => {
                if (appState.currentFontSize > 24) {
                    appState.currentFontSize -= 6;
                    el.targetSubtitleText.style.fontSize = `${appState.currentFontSize}px`;
                    el.fontSizeLabel.textContent = `${appState.currentFontSize}px`;
                }
            });
            el.btnFontLarger.addEventListener('click', () => {
                if (appState.currentFontSize < 110) {
                    appState.currentFontSize += 6;
                    el.targetSubtitleText.style.fontSize = `${appState.currentFontSize}px`;
                    el.fontSizeLabel.textContent = `${appState.currentFontSize}px`;
                }
            });

            // ブラウザフルスクリーン API 切替
            el.btnNativeFullscreen.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        showToast('フルスクリーン表示に対応していません', 'error');
                    });
                    el.nativeFsIcon.className = 'fa-solid fa-compress';
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                    el.nativeFsIcon.className = 'fa-solid fa-expand';
                }
            });

            // 履歴ドロワー開閉
            el.btnToggleHistory.addEventListener('click', () => {
                el.historyDrawer.classList.remove('translate-x-full');
            });
            el.btnCloseHistory.addEventListener('click', () => {
                el.historyDrawer.classList.add('translate-x-full');
            });

            // 履歴操作
            el.btnClearAll.addEventListener('click', () => {
                appState.history = [];
                renderHistoryUI();
                showToast('字幕履歴をクリアしました');
            });

            el.btnExportCsv.addEventListener('click', () => {
                if (appState.history.length === 0) return showToast('出力する履歴がありません');
                let csvContent = "\uFEFF時刻,原文,通訳文\n";
                appState.history.forEach(item => {
                    csvContent += `"${item.timestamp}","${item.source.replace(/"/g, '""')}","${item.target.replace(/"/g, '""')}"\n`;
                });
                downloadBlob(csvContent, `subtitles_${Date.now()}.csv`, 'text/csv;charset=utf-8;');
            });

            el.btnExportTxt.addEventListener('click', () => {
                if (appState.history.length === 0) return showToast('出力する履歴がありません');
                let txtContent = appState.history.map(item => `[${item.timestamp}]\n原文: ${item.source}\n通訳: ${item.target}\n`).join('\n---\n\n');
                downloadBlob(txtContent, `subtitles_${Date.now()}.txt`, 'text/plain;charset=utf-8;');
            });
        }

        function downloadBlob(content, filename, contentType) {
            const blob = new Blob([content], { type: contentType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // 起動処理
        window.addEventListener('DOMContentLoaded', () => {
            initVoices();
            setupSpeechRecognition();
            attachEventListeners();
        });
    </script>
</body>
</html>
